name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Build, Dependency Install, & Unit Testing + Coverage Gate
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests & Coverage Gate (min 80%)
        run: |
          python -m pytest --cov=flaskr --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: Upload Test Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # Job 2: SonarCloud SAST (Berjalan setelah build agar hasil analisis segera terunggah ke SonarCloud)
  sonarcloud:
    name: SonarCloud SAST
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Test Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Job 3: SAST Scan Bandit (Mendeteksi celah spesifik Python seperti MD5, SQLi, Debug True)
  sast-scan:
    name: SAST Scan (Bandit)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit==1.7.9

      - name: Generate Bandit JSON Report
        run: bandit -r flaskr wsgi.py -f json -o bandit-report.json --exit-zero

      - name: Upload Bandit Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Quality Gate - Fail on Medium/High Severity
        run: bandit -r flaskr wsgi.py -ll

  # Job 4: SAST Scan Semgrep (Aturan keamanan komprehensif)
  sast-semgrep:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    needs: [build, sast-scan]
    container:
      image: semgrep/semgrep
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep Scan
        run: semgrep scan --config=auto flaskr/ --error
